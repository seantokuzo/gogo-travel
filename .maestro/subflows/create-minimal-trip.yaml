# Reusable subflow — a MINIMAL, always-valid trip for flows that need SOME
# trip to exist but are not themselves testing trip creation
# (`create-trip-golden.yaml` owns that surface in full, including the
# destination picker's search-and-pick UX). Called from a signed-in
# trip-list-screen (post session-door.yaml).
#
# DATES (B-30): START = D, END = D+1, where D is the host's local "today".
#
# Why not the old same-day trip (start = end = D)? Since B-30 a trip's
# "today" is the calendar day at its DESTINATION (`todayInZone(now,
# trip.destination_tz)` — trips spec §3.4 timezone note), not the device's.
# The Kyoto destination below resolves to Asia/Tokyo (UTC+9), so a trip whose
# whole window is the host's D is only "today at the destination" for the
# few hours when Tokyo's date equals the host's — for a PDT host (UTC-7)
# that is 00:00-07:59 local, i.e. red for the other 16 hours. END = D+1
# makes the window [D, D+1], which contains the destination's today K for
# EVERY host zone whose offset is at or below Tokyo's: K - D is 0 or 1
# there (K = D+1 once the host's clock is 9h-minus-its-offset past
# midnight, else K = D), so the trip is ACTIVE at any time of day. A host
# EAST of Tokyo (UTC+10..+14, e.g. Auckland) can see K = D-1 and would need
# a different destination — out of scope for this lane (Sean's Mac is PDT).
#
# HOW: the start picker still commits its unmodified `new Date()` seed via
# the PickerCard's Done button (a brand-new field has no context yet — zero
# calendar navigation). The end picker's context is the just-committed start
# (D), so its inline calendar opens on D's month; tapping the D+1 day cell
# commits AND closes it (DateField: a CHANGED day fires onValueChange, which
# commits & closes — Done is only needed for the unmodified seed). The day
# number comes from `subflows/end-date-plus-one.js` (Maestro `runScript`, ES5;
# `new Date(y, m, d + 1)` does the month/year/leap-day rollover), and when D
# is the last day of its month one `DatePicker.NextMonth` tap precedes the
# day cell — the same selectors `create-trip-golden.yaml` drives (`text:
# "^15$"` after `DatePicker.NextMonth`, device-QA-verified S-4 T5,
# 2026-09-14). Day 1..9 cells use the same `^<n>$` shape; that single-digit
# match is exercised by the first door run after this change, not before
# (this edit was not run on a simulator).
#
# DESTINATION: the caller supplies a query (env DESTINATION_QUERY) verified
# ahead of time to return EXACTLY ONE spine result for this seed
# (`0004_destination_tier_seed.sql`) — e.g. "Kyoto". Long enough to clear the
# 4-char search floor (`isSearchableDestinationQuery`), so this is a REAL
# network search against the places spine, not the bare-3-letter-code path.
# The result is selected via `id: "trip-new-list-item-[0-9a-f-]{36}"` (a
# REGEX id match, Maestro's `id:` selector is regex-native) rather than by
# the result's own testID verbatim: `place.id` is a DB-generated UUID
# (`gen_random_uuid()` DEFAULT — the migration's INSERT never supplies one),
# so it is NOT deterministic across a fresh migration run and cannot be
# hard-coded. The regex is shaped to the UUID's exact length (36 chars,
# hex+dashes) rather than a bare `.+` (S-4 round 1 finding 1): `.+` is ALSO
# satisfied by the zero-results fallback row's testID,
# `trip-new-list-item-custom` — so if the spine were ever unseeded or the
# query stopped matching, a bare `.+` selector would silently tap the
# "custom destination" row instead of failing, going green on a broken
# search. The `assertNotVisible: trip-new-list-item-custom` immediately
# below is the positive control that rules that branch out explicitly,
# belt-and-braces on top of the tightened regex. Because DESTINATION_QUERY
# is verified unique, exactly one `trip-new-list-item-<uuid>` element exists
# whenever the real-results branch renders — so the regex is unambiguous by
# construction, not by luck.
#
# env: TRIP_NAME, DESTINATION_QUERY (a verified-unique real spine city name,
# e.g. "Kyoto" — see the header note above).
appId: ${APP_ID}
---
- tapOn:
    id: "trip-list-fab-create"
- extendedWaitUntil:
    visible:
      id: "trip-new-screen"
    timeout: 10000
- tapOn:
    id: "trip-new-input-name"
- inputText: "${TRIP_NAME}"
- tapOn:
    id: "trip-new-input-destination"
- inputText: "${DESTINATION_QUERY}"
# S-4 round 1 finding 1: `trip-new-list-item-.+` ALSO matches the
# zero-results fallback row, `trip-new-list-item-custom` ("Use ... as a
# custom destination", new.tsx:433) — `.+` is satisfied by "custom" just as
# well as by a real place's UUID. If the spine is ever unseeded/unreachable
# for this query, the search silently falls into the zero-results branch and
# this flow would tap the CUSTOM row instead of a real search result — going
# green on a broken search rather than failing loudly. `assertNotVisible`
# is the positive control (every negative assertion needs one, ADR-007): it
# proves the custom-destination fallback did NOT render before trusting a
# match against the tightened, UUID-shaped selector below (real `places.id`
# is a `gen_random_uuid()` DEFAULT — 36 chars, 8-4-4-4-12 hex+dashes — which
# "custom" can never satisfy).
- assertNotVisible:
    id: "trip-new-list-item-custom"
- extendedWaitUntil:
    visible:
      id: "trip-new-list-item-[0-9a-f-]{36}"
    timeout: 15000
- tapOn:
    id: "trip-new-list-item-[0-9a-f-]{36}"
- tapOn:
    id: "trip-new-input-dates-start"
- extendedWaitUntil:
    visible:
      id: "trip-new-input-dates-start-sheet-done"
    timeout: 10000
- tapOn:
    id: "trip-new-input-dates-start-sheet-done"
# ── end date = D+1 (see DATES above). The script runs AFTER the start date is
# committed and immediately before the end picker opens, so D here is the
# same day the start committed (a midnight crossing inside those few seconds
# would at worst make END = D+2 — still a valid, still-active trip) ─────────
- runScript: end-date-plus-one.js
- tapOn:
    id: "trip-new-input-dates-end"
- extendedWaitUntil:
    visible:
      id: "trip-new-input-dates-end-sheet"
    timeout: 10000
- runFlow:
    when:
      true: ${output.endRollsMonth === "true"}
    commands:
      - tapOn:
          id: "DatePicker.NextMonth"
- tapOn:
    text: "^${output.endDayOfMonth}$"
- extendedWaitUntil:
    notVisible:
      id: "trip-new-input-dates-end-sheet"
    timeout: 10000
- tapOn:
    id: "trip-new-button-create"
- extendedWaitUntil:
    notVisible:
      id: "trip-new-screen"
    timeout: 15000
