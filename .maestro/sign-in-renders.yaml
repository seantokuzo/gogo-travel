# Flow 3 — sign-in renders on a real Release build.
#
# This is not a "does React work" test. T-5.7 shipped a screen-down crash past
# all-green CI: `useGoogleSignIn()` calls expo-auth-session's
# `useIdTokenAuthRequest`, which THROWS during render when no Google client id
# is provisioned — and the screen test mocked `@/auth` wholesale, so nothing
# saw it. The fix renders the hook-bearing button conditionally behind
# `isGoogleConfigured()` and holds its place with a disabled placeholder.
#
# This build has no `EXPO_PUBLIC_GOOGLE_*` — i.e. it is EXACTLY the
# unconfigured state that crashed. Asserting Apple and Google are both on
# screen is asserting the render gate held, on the real native runtime, with
# the real hook, in the state that broke.
#
# `clearState: true` + `clearKeychain: true` guarantee signed-out: no stale
# session container, no leftover stash from a previous flow. `clearKeychain`
# matters now that door flows exist (S-4 T5) — the refresh token lives in
# the iOS Keychain (R-door-8 note, `subflows/session-door.yaml`), which
# `clearState` alone never wipes, and this flow runs FIRST in
# `config.yaml`'s `executionOrder` — so it is the one flow that must reset
# BOTH stores unconditionally, or a previous run's leftover authenticated
# session (e.g. `cross-tab-state`, which never signs out) leaks into this
# and every flow after it until a door flow's own subflow clears it again.
# Found via a real Neon-backed re-run (S-4 T5, 2026-09-14): without this,
# this flow — and the two `cold-open`-based flows after it, which do no
# clearing of their own — landed on `today-screen`, not `sign-in-screen`.
appId: ${APP_ID}
name: sign-in-renders
tags:
  - smoke
  - release
---
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible:
      id: "sign-in-screen"
    timeout: 20000
- assertVisible:
    id: "sign-in-header"
# Apple: the native ASAuthorization button (required on iOS, App-Review
# favored). Present means the native module resolved and mounted.
- assertVisible:
    id: "sign-in-button-apple"
# Google: the placeholder, standing in for the hook-bearing button. `sign-in.tsx`
# renders the SAME testID for both the disabled placeholder AND the real
# hook-bearing button once configured, so visibility alone cannot tell "the
# render gate held" from "Google is now configured" (S-4 round 1 / tests lane
# advisory) — asserting `enabled: false` is the actual T-5.7 pin: a build that
# renders this testID ENABLED has not held the gate, it has become configured,
# and the crash class is no longer being exercised at all.
- assertVisible:
    id: "sign-in-button-google"
    enabled: false
# A freshly launched screen has no error banner. If this is visible, something
# ran and failed before a single tap.
- assertNotVisible:
    id: "sign-in-error"
