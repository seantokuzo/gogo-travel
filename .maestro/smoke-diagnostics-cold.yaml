# Flow 1 — cold-start deeplink smoke; the B-14 regression pin.
#
# B-14 (PR #46, merged 02f46b2): a signed-out cold boot of `gogo://diagnostics`
# was STOMPED back to sign-in. The gate's first post-hydration route read
# predated the navigator's committed cold-boot landing, so it decided off the
# boot default "/" and redirected away from an (auth)-group route it was
# supposed to render. The fix is the one-shot `routeReadSettled` latch in
# AuthGate.tsx.
#
# `renderRouter`'s `serverUrl` prefetch is the structural blind spot
# (lane-confirmed during B-14's review) — jest's harness resolves the initial
# URL before hydration in a way no real cold launch does. That blind spot is
# real and is the reason this lane exists (ADR-007) — but it is NOT "nothing
# in jest reproduced it": `src/__tests__/diagnostics-coldstart-race.test.tsx`
# is the bespoke falsification pin for exactly this bug (renders `ExpoRoot`
# directly with a promise-valued `getLinkingURL` and holds hydration pending),
# runs in CI, and stays red on unfixed main. This flow is not the ONLY
# regression pin; it is the one exercising the real native initial-URL
# delivery path on top of it.
#
# WHY TWO ARMS, AND WHY ARM 2 ALSO HAS A POSITIVE ASSERTION (S-4 round 1 /
# tests lane blocking finding). On a Release build the diagnostics panel
# renders no dev surface (T-S3.5 `__DEV__` gate) — but the route now mounts an
# inert `diagnostics-screen-inert` marker (`(auth)/diagnostics.tsx`) instead of
# `null`, precisely so this arm has something positive to assert. Without it,
# a lone `assertNotVisible: sign-in-screen` would equally pass if the app
# crashed before this route ever mounted (e.g. `installConsoleTap()` or an
# import it pulls throws in the Release Hermes bundle) — arm 1 is a SEPARATE
# cold launch of a DIFFERENT route, so it cannot prove the app survived arm 2.
# The `assertVisible: diagnostics-screen-inert` below closes that gap directly:
# it can only pass if this exact route rendered on this exact launch. Arm 1
# still earns its keep as the sign-in-screen control (same build, same run,
# proves the gate/splash plumbing works at all) and stays for that reason.
#
# Falsification: revert the AuthGate latch and arm 2 goes red on the
# `assertNotVisible` while arm 1 stays green. Separately: remove the inert
# marker (`return null` again) and arm 2 goes red on the `assertVisible` the
# moment the route fails to mount — a regression the old shape could not see.
appId: app.gogotravel
name: smoke-diagnostics-cold
tags:
  - smoke
  - release
---
# ── ARM 1 (CONTROL) — a gated route cold-starts to sign-in ────────────────────
- runFlow:
    file: subflows/cold-open.yaml
    env:
      LINK: "gogo://t/00000000-0000-4000-8000-000000000001"
- assertVisible:
    id: "sign-in-screen"

# ── ARM 2 (THE PIN) — an (auth)-group route is NOT stomped to sign-in ─────────
- runFlow:
    file: subflows/cold-open.yaml
    env:
      LINK: "gogo://diagnostics"
- assertNotVisible:
    id: "sign-in-screen"
