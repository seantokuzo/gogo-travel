# Flow 10 — cross-tab-state: cycles every trip tab via TAB-BAR PRESSES ONLY
# (`.claude/rules/mobile.md`'s vendored-navigator landmine: expo-router 57's
# vendored tab fork silently no-ops an imperative `router.push()`/`navigate()`
# to a route in ANOTHER tab, sim-confirmed live — `.maestro/README.md`
# "Cross-tab moves go through the tab bar"). Asserts each tab's real screen
# root renders after its press, both forward through the full set and back —
# a regression that reintroduces a push-based cross-tab jump would strand
# this flow on whichever tab it fired from, and the NEXT tab's assertion
# goes red rather than the press silently no-op'ing unnoticed.
#
# Lands on `today-screen` immediately after trip creation. The rule (B-30,
# Sean ruling 2026-09-19; `.specs/client/navigation.spec.md` §2.5, trips spec
# §3.4 timezone note): a trip is ACTIVE when the server's effective status
# says `active` AND `todayInZone(now, trip.destination_tz)` — the calendar day
# AT THE TRIP'S DESTINATION, computed by the one shared helper on both server
# and client — falls inside [start_date, end_date]. The device's own day does
# not enter into it. The Kyoto destination below resolves to Asia/Tokyo
# (UTC+9), so "today" here is TOKYO's date K.
#
# Why the minimal-trip subflow now commits start = D, end = D+1 (D = the
# host's local today; see its DATES header): the old same-day window [D, D]
# contained K only while Tokyo's date equalled the host's — for a PDT host
# that is 00:00-07:59 local, red the other 16 hours. With [D, D+1] the
# destination's today is inside the window from ANY host zone at or west of
# Tokyo's offset: Tokyo's clock leads the host's by (9h - host offset) < 24h,
# so K is either D (before the host's local time reaches 15:00 + its UTC
# offset in hours — 08:00 for PDT) or D+1 (after), and both are inside
# [D, D+1] (D+1 is the window's last day, inclusive). The trip is therefore
# active, and the default tab is Today, at every hour. (A host EAST of Tokyo,
# UTC+10..+14, can see K = D-1 — not a configuration this lane runs.) Landing
# on `today-screen` is itself a live assertion that the client's
# destination-day rule agrees with the server's status at whatever instant
# this runs — not an assumption.
#
# `wip` STAYS until a green door run: the code fix (server + client both on
# the destination day) and this flow's date change landed together in B-30,
# but the un-wip needs one real run — `bash scripts/e2e.sh --flow
# .maestro/cross-tab-state.yaml` against a door build and a server whose DB is
# at migration 0007 (`trips.destination_tz`) — and that run sources a real env
# file, so it is the operator's, not an agent's (Law #1). Run it twice at
# different host times of day (e.g. 09:00 and 19:00 local) before removing
# the tag — the failure mode this guards is time-of-day dependent. Until then
# `--include-wip` still runs it so the gap stays visible.
appId: ${APP_ID}
name: cross-tab-state
tags:
  - release
  - door
  - wip
---
- runFlow:
    file: subflows/session-door.yaml
    env:
      USER_KEY: "cross-tab-state-${RUN_ID}"
      FIRST_RUN: "false"
- extendedWaitUntil:
    visible:
      id: "trip-list-screen"
    timeout: 20000
- runFlow:
    file: subflows/create-minimal-trip.yaml
    env:
      TRIP_NAME: "Cross Tab ${RUN_ID}"
      DESTINATION_QUERY: "Kyoto"
- assertVisible:
    id: "today-screen"
- tapOn:
    id: "tab-bar-itinerary"
- assertVisible:
    id: "itinerary-screen"
- tapOn:
    id: "tab-bar-map"
- assertVisible:
    id: "map-screen"
- tapOn:
    id: "tab-bar-money"
- assertVisible:
    id: "money-screen"
- tapOn:
    id: "tab-bar-more"
- assertVisible:
    id: "more-screen"
- tapOn:
    id: "tab-bar-today"
- assertVisible:
    id: "today-screen"
