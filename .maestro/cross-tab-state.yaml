# Flow 10 — cross-tab-state: cycles every trip tab via TAB-BAR PRESSES ONLY
# (`.claude/rules/mobile.md`'s vendored-navigator landmine: expo-router 57's
# vendored tab fork silently no-ops an imperative `router.push()`/`navigate()`
# to a route in ANOTHER tab, sim-confirmed live — `.maestro/README.md`
# "Cross-tab moves go through the tab bar"). Asserts each tab's real screen
# root renders after its press, both forward through the full set and back —
# a regression that reintroduces a push-based cross-tab jump would strand
# this flow on whichever tab it fired from, and the NEXT tab's assertion
# goes red rather than the press silently no-op'ing unnoticed.
#
# Lands on `today-screen` immediately after trip creation: the minimal-trip
# subflow's same-day start/end (see its header) makes the new trip ACTIVE
# (`today ∈ [start_date, end_date]`), which the nav default-tab rule
# (R-nav-7/8, `.specs/client/navigation.spec.md` §2.5) lands on Today —
# itself a live assertion that a same-day trip really did land where the
# rule says, not an assumption.
#
# `wip` (T5 fix-round, found via a live Neon-backed door run 2026-09-14,
# ~18:00 PDT) — this is a GENUINE, spec-contradicting server bug, not a
# flow bug: `.specs/api/trips.spec.md` §3.4's own "Timezone note" requires
# "the server MUST use the same @gogo/shared helper with an explicit
# `today` input so the two surfaces [client + server] agree on the boundary
# day" — but `apps/server/src/trips/status.ts:43`'s `todayUtc()` derives
# `today` from `now.toISOString()`, i.e. UTC, while the client's
# `localTodayISO()` (`apps/mobile/src/navigation/trip-defaults.ts:17-22`)
# uses the DEVICE's local date. These disagree for a multi-hour window
# every day in any tz west of UTC (confirmed live: PDT is UTC-7, so from
# ~17:00 PDT the UTC calendar date has already rolled to "tomorrow" while
# PDT's local date has not — a same-day trip created with
# start=end=<PDT today> gets `today_UTC > end_date` server-side, so the
# server never sets `status: "active"`, and `isTripActive`
# (`trip-defaults.ts:26-29`) ANDs the server's `status` with its own
# local-tz check — the local half can never save it). Reproduced twice,
# deterministic, not flaky (two isolated `--flow` runs, identical failure).
# Filed as a QUEUE-row draft in the PR body (B-30, HIGH — this is a
# real-user-facing default-tab bug during evening/night hours in any
# tz behind UTC, not merely an e2e artifact). Out of this task's lane
# (apps/server is off-limits here) — excluded via `wip`; --include-wip
# still runs it so the gap stays visible, not silently dropped.
appId: ${APP_ID}
name: cross-tab-state
tags:
  - release
  - door
  - wip
---
- runFlow:
    file: subflows/session-door.yaml
    env:
      USER_KEY: "cross-tab-state-${RUN_ID}"
      FIRST_RUN: "false"
- extendedWaitUntil:
    visible:
      id: "trip-list-screen"
    timeout: 20000
- runFlow:
    file: subflows/create-minimal-trip.yaml
    env:
      TRIP_NAME: "Cross Tab ${RUN_ID}"
      DESTINATION_QUERY: "Kyoto"
- assertVisible:
    id: "today-screen"
- tapOn:
    id: "tab-bar-itinerary"
- assertVisible:
    id: "itinerary-screen"
- tapOn:
    id: "tab-bar-map"
- assertVisible:
    id: "map-screen"
- tapOn:
    id: "tab-bar-money"
- assertVisible:
    id: "money-screen"
- tapOn:
    id: "tab-bar-more"
- assertVisible:
    id: "more-screen"
- tapOn:
    id: "tab-bar-today"
- assertVisible:
    id: "today-screen"
