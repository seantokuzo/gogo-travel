# Maestro workspace config (ADR-007).
#
# Only top-level `.maestro/*.yaml` files are runnable flows. Everything under
# `subflows/` is a `runFlow: file:` fragment — parameterised, meaningless on
# its own, and it must never be discovered as a test.
flows:
  - "*.yaml"

# Explicit order (S-4 round 1 / tests lane advisory) — before this, the run
# order was alphabetical luck: `sign-in-cancel-surface` happened to run before
# `deeplink-matrix`, so the system sheet it could leave standing (see that
# flow's HOUSEKEEPING comment) wedged a flow after it. `sign-in-cancel-surface`
# now also cleans up via its own `onFlowComplete` hook regardless of
# pass/fail — this ordering is belt-and-braces on top of that, running the
# flow most likely to leave OS-level UI standing LAST so nothing else can
# inherit it. `continueOnFailure: true` is deliberate: this is a smoke/release
# suite meant to report every flow's result in one run (the merge gate wants a
# single JUnit with all four release flows' outcomes, not an early stop).
#
# S-4 wave 2 (T5): the authenticated flows (5-10) are listed session-door-entry
# FIRST — it is the barrier every later flow's `runFlow: subflows/session-door.yaml`
# depends on, so a red run triages there first — then in the order the
# session-door spec's §5.1 flow list gives them. `session-door-absent` is the
# separate door-FREE proof (--variant doorfree only; harmless to list here
# too since a --variant door run's tag exclusion already keeps it out).
# `sign-in-cancel-surface` stays LAST regardless, for the reason above.
executionOrder:
  continueOnFailure: true
  flowsOrder:
    - sign-in-renders
    - smoke-diagnostics-cold
    - deeplink-matrix
    - session-door-entry
    - create-trip-golden
    - add-flight-dateline
    - ideas-to-schedule
    - cancel-visibility
    - cross-tab-state
    - session-door-absent
    - sign-in-cancel-surface
